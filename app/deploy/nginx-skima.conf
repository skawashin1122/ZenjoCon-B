# Nginx：HTTPSを受け付けて、FastAPI（127.0.0.1:8000）に渡す
# 置き場所: /etc/nginx/sites-available/skima （sites-enabled にリンクする）
# SERVER_NAME はドメイン名に置き換える。証明書は certbot --nginx で取得する。

server {
    listen 80;
    server_name SERVER_NAME;

    # スマホから送られる写真・声（アプリ側の上限15MBに合わせる）
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;   # AIの返事を待つ時間
    }

    location /static/ {
        alias /opt/skima/app/skima/static/;
        expires 7d;
    }
}
